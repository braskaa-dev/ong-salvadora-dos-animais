<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro - ONG Salvadora dos Animais</title><link rel="stylesheet" href="../css/style.css"></head><body><header><h1>Cadastro</h1><p>Preencha seus dados para participar das ações da nossa ONG.</p></header><nav><input type="checkbox" id="menu-toggle" aria-label="Abrir menu de navegação"> <label for="menu-toggle" class="menu-icon">☰</label><div class="menu"><a href="index.html">Início</a><div class="dropdown"><a href="projetos.html">Projetos</a><div class="submenu"><a href="projetos.html#resgate">Resgate de animais</a> <a href="projetos.html#adocao">Campanha de adoção</a></div></div><a href="cadastro.html">Cadastro</a></div></nav><main><section><h2>Cadastro de voluntários</h2><form action="#" method="post"><fieldset><legend>Dados pessoais</legend><div><label for="nome">Nome completo:</label> <input type="text" id="nome" name="nome" placeholder="Nome Completo" required></div><div><label for="cpf">CPF:</label> <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required></div><div><label for="nascimento">Data de nascimento:</label> <input type="date" id="nascimento" name="nascimento" required></div></fieldset><fieldset><legend>Contato</legend><div><label for="email">E-mail:</label> <input type="email" id="email" name="email" required></div><div><label for="telefone">Telefone:</label> <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required></div></fieldset><fieldset><legend>Endereço</legend><div><label for="cep">CEP:</label> <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" required></div><div><label for="endereco">Endereço:</label> <input type="text" id="endereco" name="endereco" required></div><div><label for="cidade">Cidade:</label> <input type="text" id="cidade" name="cidade" required></div><div><label for="estado">Estado:</label> <input type="text" id="estado" name="estado" required></div></fieldset><input type="submit" value="Enviar"></form></section></main><footer><p>&copy; 2026 ONG Salvadora dos Animais</p></footer></body></html>
